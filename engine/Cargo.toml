[package]
name = "engine"
version = "0.1.0"
edition = "2024"

[dependencies]
macroquad = "0.4.14"
engine_macros = {path = "engine_macros"}
ron = "0.12.1"
serde = { version = "1.0.228", features = ["derive"]}
erased-serde = "0.4.10"
downcast-rs = "2.0.2"
criterion = { version = "0.5", features = ["html_reports"] }
tokio = { version = "1.53.1", features = ["rt", "fs", "macros", "sync"] }
instrument = "0.2.0"
tracing = "0.1.44"
async-channel = "2.5.0"
image = "0.25.10"
trpl = "0.3.0"
postcard = "1.1.3"

[[bench]]
name = "world"
harness = false
